<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fffaf7;
        color: #2d2523;
    }

    header {
        background: #2d2523;
        padding: 20px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        color: #e8c9a8;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-weight: bold;
    }

    nav a:hover {
        color: #e8c9a8;
    }

    .contact {
        max-width: 700px;
        margin: 70px auto;
        padding: 45px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .contact h1 {
        text-align: center;
        font-size: 42px;
        color: #b8865b;
        margin-bottom: 35px;
    }

    .info {
        text-align: center;
        line-height: 2;
        color: #665b57;
        font-size: 18px;
    }

    .contact-form {
        margin-top: 30px;
    }

    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
    }

    .contact-form textarea {
        height: 130px;
        resize: none;
    }

    .contact-form button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 30px;
        background: #2d2523;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .contact-form button:hover {
        background: #b8865b;
    }

    footer {
        background: #2d2523;
        color: white;
        text-align: center;
        padding: 25px;
    }
</style>
